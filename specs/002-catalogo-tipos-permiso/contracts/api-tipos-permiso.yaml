openapi: 3.0.3
info:
  title: SADER Database Access Permissions API - Tipos de Permiso
  description: |
    API endpoint for retrieving the catalog of database permission types.
    Part of the Admin bounded context in the SADER system.
  version: 1.0.0
  contact:
    name: DGTIC SADER
    email: dgtic@sader.gob.mx

servers:
  - url: http://localhost/api/v1
    description: Local development server
  - url: https://api.sader.gob.mx/api/v1
    description: Production server

tags:
  - name: Admin
    description: Administrative catalog endpoints

paths:
  /admin/tipos-permiso:
    get:
      tags:
        - Admin
      summary: Obtener catálogo de tipos de permiso
      description: |
        Returns the complete catalog of active database permission types.
        
        Only tipos de permiso with `activo = true` are returned.
        Results are ordered by ID in ascending order.
        
        **Business Rules**:
        - BR-001: Only active permission types are exposed
        - BR-002: Results must be ordered by ID ascending
        
        **Rate Limiting**: 60 requests per minute per IP address
      operationId: obtenerTiposPermiso
      parameters: []
      responses:
        '200':
          description: Successfully retrieved tipos de permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObtenerTiposPermisoSuccessResponse'
              examples:
                withData:
                  summary: Successful response with data
                  value:
                    success: true
                    message: "Tipos de permiso obtenidos exitosamente."
                    code: 200
                    data:
                      tiposPermiso:
                        - id: 1
                          nombre: "Consulta"
                        - id: 2
                          nombre: "Cambios"
                        - id: 3
                          nombre: "Eliminación"
                        - id: 4
                          nombre: "Consulta y Cambios"
                emptyData:
                  summary: No active tipos de permiso
                  value:
                    success: true
                    message: "No hay tipos de permiso activos"
                    code: 200
                    data: []
        
        '429':
          description: Too Many Requests - Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'
              example:
                message: "Too Many Attempts."
                exception: "Illuminate\\Http\\Exceptions\\ThrottleRequestsException"
        
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Error al obtener los tipos de permiso."
                code: 500
                data: []

components:
  schemas:
    TipoPermisoDto:
      type: object
      description: Data Transfer Object representing a single tipo de permiso
      required:
        - id
        - nombre
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier
          example: 1
          minimum: 1
        nombre:
          type: string
          description: Permission type name
          example: "Consulta"
          maxLength: 50
          minLength: 1
      additionalProperties: false

    ObtenerTiposPermisoSuccessResponse:
      type: object
      description: Standard success response wrapper
      required:
        - success
        - message
        - code
        - data
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
          example: true
        message:
          type: string
          description: Human-readable success message (Spanish)
          example: "Tipos de permiso obtenidos exitosamente."
        code:
          type: integer
          format: int32
          description: HTTP status code
          example: 200
        data:
          oneOf:
            - type: object
              description: Collection of tipos de permiso
              required:
                - tiposPermiso
              properties:
                tiposPermiso:
                  type: array
                  description: Array of active permission types
                  items:
                    $ref: '#/components/schemas/TipoPermisoDto'
              additionalProperties: false
            - type: array
              description: Empty array when no active tipos de permiso exist
              items: {}
              maxItems: 0
      additionalProperties: false

    ErrorResponse:
      type: object
      description: Standard error response wrapper
      required:
        - success
        - message
        - code
        - data
      properties:
        success:
          type: boolean
          description: Always false for errors
          example: false
        message:
          type: string
          description: Human-readable error message (Spanish)
          example: "Error al obtener los tipos de permiso."
        code:
          type: integer
          format: int32
          description: HTTP status code
          example: 500
        data:
          type: array
          description: Always empty array for errors
          items: {}
          maxItems: 0
      additionalProperties: false

    RateLimitErrorResponse:
      type: object
      description: Laravel rate limit exceeded response
      required:
        - message
      properties:
        message:
          type: string
          description: Rate limit error message
          example: "Too Many Attempts."
        exception:
          type: string
          description: Exception class name
          example: "Illuminate\\Http\\Exceptions\\ThrottleRequestsException"
      additionalProperties: false

  securitySchemes: {}

security: []
